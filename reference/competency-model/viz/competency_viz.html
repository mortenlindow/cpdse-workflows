<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PDS Competency Profile</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  :root {
    --bg: #fafafa;
    --fg: #222;
    --muted: #888;
    --accent: #2c7fb8;
    --accent-soft: #2c7fb833;
    --grid: #ccc;
    --bar-bg: #eee;
    --bar-fill: #2c7fb8;
  }
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 20px; color: var(--fg); background: var(--bg); }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls input[type="text"] { font: inherit; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
  button { font: inherit; padding: 4px 10px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer; }
  button:hover { background: #f0f0f0; }
  .breadcrumb { color: var(--muted); margin: 8px 0 16px; }
  .breadcrumb a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .panel { background: white; border: 1px solid #e0e0e0; border-radius: 6px; padding: 16px; }
  .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .axis-label { font-size: 12px; cursor: pointer; }
  .axis-label:hover { fill: var(--accent); font-weight: 600; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
  .legend-swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .subarea-row { cursor: pointer; }
  .subarea-row:hover .subarea-name { fill: var(--accent); font-weight: 600; }
  .comp { padding: 10px 0; border-top: 1px solid #eee; }
  .comp:first-child { border-top: 0; }
  .comp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .comp-head .id { color: var(--muted); font-family: ui-monospace, monospace; font-size: 12px; }
  .comp-head .name { font-weight: 600; }
  .level-picker { display: flex; gap: 4px; margin: 6px 0; }
  .level-btn { width: 32px; height: 28px; line-height: 26px; text-align: center; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer; font-size: 12px; user-select: none; }
  .level-btn:hover { background: #f0f0f0; }
  .level-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
  .level-btn.zero { color: var(--muted); }
  .level-desc { color: var(--muted); font-size: 12px; min-height: 1.4em; }
  .empty { color: var(--muted); font-style: italic; }
  .status { color: var(--muted); font-size: 12px; }
  .legend-scale { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>PDS Competency Profile</h1>
  <div class="controls">
    <input id="name" type="text" placeholder="Profile name" />
    <button id="load-btn">Load profile…</button>
    <input id="load-file" type="file" accept="application/json" hidden />
    <button id="save-btn">Download profile</button>
    <button id="clear-btn">Clear all</button>
    <span id="status" class="status"></span>
  </div>
</header>

<div class="breadcrumb" id="breadcrumb"></div>

<div class="layout">
  <div class="panel">
    <svg id="radar" width="500" height="500" viewBox="0 0 500 500"></svg>
    <div class="legend">
      <span><span class="legend-swatch" style="background: var(--accent-soft); border: 1px solid var(--accent);"></span>You</span>
      <span><span class="legend-swatch" style="background: var(--grid);"></span>Reference (Proficiency · L3)</span>
      <span style="margin-left: auto;">Click an axis label to drill down</span>
    </div>
    <div class="legend-scale" id="level-scale"></div>
  </div>
  <div class="panel" id="detail-panel">
    <div id="detail" class="empty">Click a domain on the radar to see its sub-areas.</div>
  </div>
</div>

<script>
const MAX_LEVEL = 5;

const state = {
  model: null,
  levels: {},          // { competencyId: 0..5 }
  name: "Untitled",
  view: { level: "overview", domain: null, subarea: null },
};

async function init() {
  state.model = await d3.json("model.json");
  try {
    const p = await d3.json("person.example.json");
    applyPerson(p);
  } catch (e) {
    state.name = "Untitled";
  }
  document.getElementById("name").value = state.name;
  renderLevelScale();
  bindControls();
  render();
}

function applyPerson(p) {
  state.name = p.name || "Untitled";
  state.levels = {};
  const src = p.levels || {};
  for (const k of Object.keys(src)) state.levels[k] = clampLevel(src[k]);
}

function clampLevel(n) {
  n = Math.round(Number(n) || 0);
  return Math.max(0, Math.min(MAX_LEVEL, n));
}

function renderLevelScale() {
  const labels = state.model.levels || ["L1", "L2", "L3", "L4", "L5"];
  document.getElementById("level-scale").textContent =
    "Levels: " + labels.map((n, i) => `${i + 1} ${n}`).join(" · ") + " (0 = none)";
}

function bindControls() {
  document.getElementById("name").addEventListener("input", e => { state.name = e.target.value; });
  document.getElementById("load-btn").addEventListener("click", () => document.getElementById("load-file").click());
  document.getElementById("load-file").addEventListener("change", async e => {
    const f = e.target.files[0];
    if (!f) return;
    const text = await f.text();
    try {
      applyPerson(JSON.parse(text));
      document.getElementById("name").value = state.name;
      flash("Loaded " + f.name);
      render();
    } catch (err) { flash("Invalid JSON"); }
  });
  document.getElementById("save-btn").addEventListener("click", () => {
    const out = { name: state.name, levels: {} };
    for (const k of Object.keys(state.levels).sort()) {
      if (state.levels[k] > 0) out.levels[k] = state.levels[k];
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (state.name || "profile").replace(/\s+/g, "_") + ".json";
    a.click();
  });
  document.getElementById("clear-btn").addEventListener("click", () => {
    if (confirm("Clear all levels?")) { state.levels = {}; render(); }
  });
}

function flash(msg) {
  const s = document.getElementById("status");
  s.textContent = msg;
  setTimeout(() => { s.textContent = ""; }, 2000);
}

// ---- aggregation (mean level) ----
function compLevel(c) { return state.levels[c.id] || 0; }
function subareaAvg(sa) {
  if (!sa.competencies.length) return 0;
  return d3.mean(sa.competencies, compLevel);
}
function domainAvg(d) {
  const all = d.subareas.flatMap(s => s.competencies);
  if (!all.length) return 0;
  return d3.mean(all, compLevel);
}

// ---- render ----
function render() {
  renderRadar();
  renderDetail();
  renderBreadcrumb();
}

function renderBreadcrumb() {
  const bc = document.getElementById("breadcrumb");
  const parts = [`<a data-nav="overview">Overview</a>`];
  if (state.view.domain) parts.push(`<a data-nav="domain">${esc(state.view.domain)}</a>`);
  if (state.view.subarea) parts.push(`<span>${esc(state.view.subarea)}</span>`);
  bc.innerHTML = parts.join(" › ");
  bc.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", () => {
      const t = a.dataset.nav;
      if (t === "overview") state.view = { level: "overview", domain: null, subarea: null };
      else if (t === "domain") state.view = { level: "domain", domain: state.view.domain, subarea: null };
      render();
    });
  });
}

function renderRadar() {
  const svg = d3.select("#radar");
  svg.selectAll("*").remove();
  const W = 500, H = 500, cx = W / 2, cy = H / 2, R = 180;
  const domains = state.model.domains;
  const N = domains.length;
  const angle = i => (Math.PI * 2 * i) / N - Math.PI / 2;
  const g = svg.append("g");

  // grid rings (one per level)
  for (let k = 1; k <= MAX_LEVEL; k++) {
    const isOuter = k === MAX_LEVEL;
    g.append("circle")
      .attr("cx", cx).attr("cy", cy).attr("r", (R * k) / MAX_LEVEL)
      .attr("fill", "none").attr("stroke", "var(--grid)")
      .attr("stroke-dasharray", isOuter ? null : "2 3");
  }
  // axes
  domains.forEach((d, i) => {
    const x = cx + Math.cos(angle(i)) * R;
    const y = cy + Math.sin(angle(i)) * R;
    g.append("line").attr("x1", cx).attr("y1", cy).attr("x2", x).attr("y2", y).attr("stroke", "var(--grid)");
  });

  // reference polygon at level 3
  const refF = 3 / MAX_LEVEL;
  const refPts = domains.map((d, i) => [cx + Math.cos(angle(i)) * R * refF, cy + Math.sin(angle(i)) * R * refF]);
  g.append("polygon").attr("points", refPts.map(p => p.join(",")).join(" "))
    .attr("fill", "var(--grid)").attr("fill-opacity", 0.15)
    .attr("stroke", "var(--grid)").attr("stroke-dasharray", "3 3");

  // person polygon
  const pts = domains.map((d, i) => {
    const r = R * (domainAvg(d) / MAX_LEVEL);
    return [cx + Math.cos(angle(i)) * r, cy + Math.sin(angle(i)) * r];
  });
  g.append("polygon").attr("points", pts.map(p => p.join(",")).join(" "))
    .attr("fill", "var(--accent)").attr("fill-opacity", 0.25)
    .attr("stroke", "var(--accent)").attr("stroke-width", 2);
  g.selectAll("circle.pt").data(pts).enter().append("circle")
    .attr("class", "pt").attr("cx", d => d[0]).attr("cy", d => d[1]).attr("r", 3)
    .attr("fill", "var(--accent)");

  // axis labels (clickable)
  domains.forEach((d, i) => {
    const lr = R + 30;
    const x = cx + Math.cos(angle(i)) * lr;
    const y = cy + Math.sin(angle(i)) * lr;
    const cosA = Math.cos(angle(i));
    const anchor = cosA > 0.2 ? "start" : cosA < -0.2 ? "end" : "middle";
    const label = g.append("text")
      .attr("class", "axis-label")
      .attr("x", x).attr("y", y)
      .attr("text-anchor", anchor)
      .attr("dominant-baseline", "middle")
      .style("fill", state.view.domain === d.name ? "var(--accent)" : "var(--fg)")
      .on("click", () => { state.view = { level: "domain", domain: d.name, subarea: null }; render(); });
    wrap(label, d.name, 110);
    label.append("tspan").attr("x", x).attr("dy", "1.2em")
      .style("fill", "var(--muted)").style("font-size", "11px")
      .text(`avg ${domainAvg(d).toFixed(1)}/${MAX_LEVEL}`);
  });
}

function wrap(textSel, str, width) {
  if (str.length * 6 < width) { textSel.text(str); return; }
  const words = str.split(/\s+/);
  const mid = Math.ceil(words.length / 2);
  const a = words.slice(0, mid).join(" "), b = words.slice(mid).join(" ");
  const x = textSel.attr("x");
  textSel.text(null);
  textSel.append("tspan").attr("x", x).text(a);
  textSel.append("tspan").attr("x", x).attr("dy", "1.1em").text(b);
}

function renderDetail() {
  const el = document.getElementById("detail");
  if (state.view.level === "overview") {
    el.innerHTML = '<div class="empty">Click a domain on the radar to see its sub-areas.</div>';
    return;
  }
  const dom = state.model.domains.find(d => d.name === state.view.domain);
  if (!dom) return;
  if (state.view.level === "domain") renderSubareas(el, dom);
  else renderChecklist(el, dom);
}

function renderSubareas(el, dom) {
  el.innerHTML = `<h2 style="margin:0 0 12px;font-size:16px;">${esc(dom.name)}</h2>`;
  const W = 460, rowH = 48, padTop = 20, padLeft = 200, barW = W - padLeft - 20;
  const H = padTop + dom.subareas.length * rowH + 10;
  const svg = d3.select(el).append("svg").attr("width", W).attr("height", H).attr("viewBox", `0 0 ${W} ${H}`);

  dom.subareas.forEach((sa, i) => {
    const y = padTop + i * rowH;
    const row = svg.append("g").attr("class", "subarea-row")
      .on("click", () => { state.view = { level: "subarea", domain: dom.name, subarea: sa.name }; render(); });
    row.append("rect").attr("x", 0).attr("y", y - 4).attr("width", W).attr("height", rowH - 4).attr("fill", "transparent");
    row.append("text").attr("class", "subarea-name").attr("x", 10).attr("y", y + 14).text(sa.name);
    const avg = subareaAvg(sa);
    const reached = sa.competencies.filter(c => compLevel(c) > 0).length;
    row.append("text").attr("x", 10).attr("y", y + 32).style("font-size", "11px").style("fill", "var(--muted)")
      .text(`avg ${avg.toFixed(1)}/${MAX_LEVEL} · ${reached}/${sa.competencies.length} started`);

    // bar background
    row.append("rect").attr("x", padLeft).attr("y", y + 6).attr("width", barW).attr("height", 18)
      .attr("fill", "var(--bar-bg)").attr("rx", 3);
    // level tick marks
    for (let k = 1; k < MAX_LEVEL; k++) {
      const tx = padLeft + (k / MAX_LEVEL) * barW;
      row.append("line").attr("x1", tx).attr("x2", tx).attr("y1", y + 6).attr("y2", y + 24)
        .attr("stroke", "white").attr("stroke-width", 1);
    }
    // fill = avg
    const fillW = (avg / MAX_LEVEL) * barW;
    row.append("rect").attr("x", padLeft).attr("y", y + 6).attr("width", fillW).attr("height", 18)
      .attr("fill", "var(--bar-fill)").attr("rx", 3);
    // label at end of fill
    row.append("text").attr("x", padLeft + barW + 8).attr("y", y + 19)
      .style("font-size", "12px").style("fill", "var(--fg)")
      .text(avg ? avg.toFixed(1) : "—");
  });
}

function renderChecklist(el, dom) {
  const sa = dom.subareas.find(s => s.name === state.view.subarea);
  if (!sa) return;
  el.innerHTML = `<h2 style="margin:0 0 4px;font-size:16px;">${esc(sa.name)}</h2>
                  <div class="status" style="margin-bottom:8px;">${esc(dom.name)} · pick a level (0–${MAX_LEVEL}) for each</div>`;
  const labels = state.model.levels || [];
  sa.competencies.forEach(c => {
    const wrap = document.createElement("div");
    wrap.className = "comp";
    const head = document.createElement("div");
    head.className = "comp-head";
    head.innerHTML = `<span class="id">[${esc(c.id)}]</span><span class="name">${esc(c.name)}</span>`;
    wrap.appendChild(head);

    const picker = document.createElement("div");
    picker.className = "level-picker";
    const current = compLevel(c);
    for (let k = 0; k <= MAX_LEVEL; k++) {
      const btn = document.createElement("div");
      btn.className = "level-btn" + (k === current ? " active" : "") + (k === 0 ? " zero" : "");
      btn.textContent = k === 0 ? "—" : k;
      btn.title = k === 0 ? "None" : `${k} ${labels[k - 1] || ""}`;
      btn.addEventListener("click", () => {
        state.levels[c.id] = k;
        render();
      });
      picker.appendChild(btn);
    }
    wrap.appendChild(picker);

    const desc = document.createElement("div");
    desc.className = "level-desc";
    if (current > 0 && c.descriptions && c.descriptions[current - 1]) {
      desc.textContent = `L${current} ${labels[current - 1] || ""} — ${c.descriptions[current - 1]}`;
    } else if (c.descriptions && c.descriptions[0]) {
      desc.textContent = `L1 ${labels[0] || ""} — ${c.descriptions[0]}`;
      desc.style.opacity = 0.6;
    }
    wrap.appendChild(desc);
    el.appendChild(wrap);
  });
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

init().catch(err => {
  document.body.insertAdjacentHTML("beforeend", `<p style="color:#c00">Failed to load. Serve this directory over HTTP (e.g. <code>python3 -m http.server</code>) — opening the file directly hits CORS. ${esc(err.message)}</p>`);
});
</script>

</body>
</html>
